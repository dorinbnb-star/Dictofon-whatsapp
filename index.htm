<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dictare WhatsApp</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #111; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
h1 { color: #25D366; margin-bottom: 20px; font-size: 1.4rem; }
select, input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; font-size: 1rem; }
textarea { height: 150px; resize: none; background: #222; color: #fff; }
button { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
#btnDictare { background: #25D366; color: #fff; }
#btnDictare.activ { background: #e74c3c; }
#btnWA { background: #128C7E; color: #fff; }
#btnCopy { background: #333; color: #fff; }
</style>
</head>
<body>
<h1>🎙️ Dictare WhatsApp</h1>
<select id="limba">
<option value="ro-RO">Română</option>
<option value="ru-RU">Rusă</option>
<option value="en-US">Engleză</option>
<option value="fr-FR">Franceză</option>
</select>
<input id="numar" type="tel" placeholder="Număr WhatsApp (ex: +32470123456)">
<textarea id="text" placeholder="Mesajul apare aici..."></textarea>
<button id="btnDictare" onclick="toggleDictare()">🎙️ Apasă și vorbește</button>
<button id="btnWA" onclick="trimitePeWA()">📲 Trimite pe WhatsApp</button>
<button id="btnCopy" onclick="copiaza()">📋 Copiază</button>
<script>
let rec, dictam = false;
const numarSalvat = localStorage.getItem('numar');
if (numarSalvat) document.getElementById('numar').value = numarSalvat;

function toggleDictare() {
  if (!dictam) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Browserul nu suportă dictarea. Folosește Chrome.'); return; }
    rec = new SR();
    rec.lang = document.getElementById('limba').value;
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = e => {
      let t = '';
      for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      document.getElementById('text').value = t;
    };
    rec.start();
    dictam = true;
    document.getElementById('btnDictare').textContent = '⏹️ Oprește dictarea';
    document.getElementById('btnDictare').classList.add('activ');
  } else {
    rec.stop();
    dictam = false;
    document.getElementById('btnDictare').textContent = '🎙️ Apasă și vorbește';
    document.getElementById('btnDictare').classList.remove('activ');
  }
}

function trimitePeWA() {
  const nr = document.getElementById('numar').value.replace(/\s/g,'');
  const msg = document.getElementById('text').value;
  if (!msg) { alert('Dictează un mesaj mai întâi.'); return; }
  localStorage.setItem('numar', nr);
  const url = nr ? `https://wa.me/${nr.replace('+','')}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

function copiaza() {
  navigator.clipboard.writeText(document.getElementById('text').value);
  alert('Copiat!');
}
</script>
</body>
</html>
