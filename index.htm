<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dictare WA</title>
<link rel="manifest" href="data:application/json,{%22name%22:%22Dictare%20WhatsApp%22,%22short_name%22:%22DictWA%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23111111%22,%22theme_color%22:%22%2325D366%22}">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23111'/%3E%3Crect x='40' y='15' width='20' height='35' rx='10' fill='%2325D366'/%3E%3Cpath d='M25 45 Q25 70 50 70 Q75 70 75 45' stroke='%2325D366' stroke-width='4' fill='none'/%3E%3Crect x='47' y='70' width='6' height='12' fill='%2325D366'/%3E%3Crect x='35' y='82' width='30' height='5' rx='2' fill='%2325D366'/%3E%3C/svg%3E">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #111; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
h1 { color: #25D366; margin: 20px 0; font-size: 1.4rem; }
select, input, textarea { width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; border: none; font-size: 1rem; background: #222; color: #fff; }
button { width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; }
#btnTine { background: #25D366; color: #fff; padding: 20px; font-size: 1.2rem; user-select: none; -webkit-user-select: none; }
#btnTine.activ { background: #e74c3c; }
#btnWA { background: #128C7E; color: #fff; }
#btnCopy { background: #444; color: #fff; }
#btnSterge { background: #333; color: #aaa; }
.section { width: 100%; max-width: 480px; }
.contact-row { display: flex; gap: 8px; margin: 4px 0; }
.contact-row input { margin: 0; }
.btn-verde { background: #25D366; color: #fff; padding: 10px; border-radius: 10px; border: none; cursor: pointer; flex: 1; font-weight: bold; }
.btn-del { background: #e74c3c; color: #fff; padding: 10px; border-radius: 10px; border: none; cursor: pointer; flex-shrink: 0; }
#btnAdauga { background: #2980b9; color: #fff; }
h3 { color: #aaa; font-size: 0.9rem; margin: 14px 0 4px; }
#status { color: #aaa; font-size: 0.85rem; text-align: center; margin: 4px 0; min-height: 20px; }
.row2 { display: flex; gap: 8px; }
.row2 select { margin: 6px 0; }
</style>
</head>
<body>
<div class="section">
<h1>🎙️ Dictare WhatsApp</h1>

<h3>DICTEZ ÎN</h3>
<div class="row2">
<select id="limba">
<option value="ro-RO">Română</option>
<option value="ru-RU">Rusă</option>
<option value="en-US">Engleză</option>
<option value="fr-FR">Franceză</option>
</select>
<select id="traduce">
<option value="">Fără traducere</option>
<option value="en">Traduce în EN</option>
<option value="fr">Traduce în FR</option>
<option value="ru">Traduce în RU</option>
<option value="ro">Traduce în RO</option>
</select>
</div>

<h3>CONTACTE SALVATE</h3>
<div id="listaContacte"></div>
<div class="contact-row">
<input id="numeNou" type="text" placeholder="Nume">
<input id="numarNou" type="tel" placeholder="+32470...">
</div>
<button id="btnAdauga" onclick="adaugaContact()">+ Salvează contact</button>

<h3>TRIMITE CĂTRE</h3>
<input id="numarSelectat" type="tel" placeholder="Număr selectat sau scrie manual">

<h3>MESAJ</h3>
<textarea id="text" placeholder="Mesajul apare aici..."></textarea>
<p id="status">Ține apăsat butonul și vorbește</p>
<button id="btnTine">🎙️ ȚINE APĂSAT ȘI VORBEȘTE</button>
<button id="btnSterge" onclick="stergeText()">🗑️ Șterge mesajul</button>
<button id="btnWA" onclick="trimitePeWA()">📲 Trimite pe WhatsApp</button>
<button id="btnCopy" onclick="copiaza()">📋 Copiază mesajul</button>
</div>

<script>
let rec = null;
const btn = document.getElementById('btnTine');
const status = document.getElementById('status');
const textArea = document.getElementById('text');

function adaugaPunct(text) {
  if (!text || !text.trim()) return '';
  let t = text.trim();
  t = t.charAt(0).toUpperCase() + t.slice(1);
  const cuvinteIntrebare = [
    'ce','cine','când','unde','cum','cât','câte','câți','care','oare',
    'ai','ați','ești','este','are','au','pot','poți','vrei','vreți',
    'merge','mergi','știi','știți','vine','vii','poate','putem','avem',
    'what','where','when','who','how','why','is','do','does','can','will','would','should','have','has',
    'где','когда','кто','что','как','почему','сколько','есть','могу','можешь'
  ];
  const primaVorba = t.split(' ')[0].toLowerCase().replace(/[,.]/, '');
  const incepeDeC = t.toLowerCase().startsWith('de ce') || t.toLowerCase().startsWith('de unde') || t.toLowerCase().startsWith('de când');
  const esteIntrebare = cuvinteIntrebare.includes(primaVorba) || incepeDeC;
  if (!/[.!?]$/.test(t)) t += esteIntrebare ? '?' : '.';
  return t;
}

async function traduceText(text, spre) {
  if (!spre) return null;
  const limba = document.getElementById('limba').value.split('-')[0];
  try {
    status.textContent = 'Traduc...';
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${limba}|${spre}`;
    const r = await fetch(url);
    const d = await r.json();
    if (d.responseStatus === 200) return d.responseData.translatedText;
  } catch(e) {}
  return null;
}

function startDictare() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Folosește Chrome.'); return; }
  rec = new SR();
  rec.lang = document.getElementById('limba').value;
  rec.continuous = false;
  rec.interimResults = true;
  const bazaText = textArea.value;
  let finalResult = '';

  rec.onresult = e => {
    let interim = '';
    finalResult = '';
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalResult += e.results[i][0].transcript;
      else interim = e.results[i][0].transcript;
    }
    const preview = bazaText ? bazaText.trim() + ' ' + (finalResult || interim) : (finalResult || interim);
    textArea.value = preview;
  };

  rec.onend = async () => {
    if (finalResult.trim()) {
      const spre = document.getElementById('traduce').value;
      let frazaFinala = adaugaPunct(finalResult);
      if (spre) {
        const tradus = await traduceText(finalResult, spre);
        if (tradus) frazaFinala = adaugaPunct(tradus);
      }
      textArea.value = bazaText.trim() ? bazaText.trim() + ' ' + frazaFinala + ' ' : frazaFinala + ' ';
    }
    btn.classList.remove('activ');
    btn.textContent = '🎙️ ȚINE APĂSAT ȘI VORBEȘTE';
    status.textContent = 'Ține apăsat butonul și vorbește';
    rec = null;
  };

  rec.onerror = () => {
    btn.classList.remove('activ');
    btn.textContent = '🎙️ ȚINE APĂSAT ȘI VORBEȘTE';
    status.textContent = 'Ține apăsat butonul și vorbește';
    rec = null;
  };

  rec.start();
  btn.classList.add('activ');
  btn.textContent = '🔴 VORBEȘTE...';
  status.textContent = 'Ascult...';
}

function stopDictare() {
  if (rec) { rec.stop(); }
}

btn.addEventListener('mousedown', startDictare);
btn.addEventListener('mouseup', stopDictare);
btn.addEventListener('mouseleave', stopDictare);
btn.addEventListener('touchstart', e => { e.preventDefault(); startDictare(); });
btn.addEventListener('touchend', e => { e.preventDefault(); stopDictare(); });

function stergeText() { textArea.value = ''; }

function trimitePeWA() {
  const nr = document.getElementById('numarSelectat').value.replace(/\s/g,'');
  const msg = textArea.value.trim();
  if (!msg) { alert('Dictează un mesaj mai întâi.'); return; }
  const url = nr ? `https://wa.me/${nr.replace('+','')}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

function copiaza() {
  navigator.clipboard.writeText(textArea.value);
  alert('Copiat!');
}

function getContacte() { return JSON.parse(localStorage.getItem('contacte') || '[]'); }
function saveContacte(c) { localStorage.setItem('contacte', JSON.stringify(c)); }
function adaugaContact() {
  const nume = document.getElementById('numeNou').value.trim();
  const numar = document.getElementById('numarNou').value.trim();
  if (!nume || !numar) { alert('Completează nume și număr.'); return; }
  const c = getContacte();
  c.push({ nume, numar });
  saveContacte(c);
  document.getElementById('numeNou').value = '';
  document.getElementById('numarNou').value = '';
  randeazaContacte();
}
function stergeContact(i) {
  const c = getContacte();
  c.splice(i, 1);
  saveContacte(c);
  randeazaContacte();
}
function selecteazaContact(numar) {
  document.getElementById('numarSelectat').value = numar;
}
function randeazaContacte() {
  const c = getContacte();
  const div = document.getElementById('listaContacte');
  if (c.length === 0) { div.innerHTML = '<p style="color:#666;font-size:0.85rem;margin:4px 0">Niciun contact salvat</p>'; return; }
  div.innerHTML = c.map((x, i) => `
    <div class="contact-row">
      <button class="btn-verde" onclick="selecteazaContact('${x.numar}')">${x.nume}</button>
      <button class="btn-del" onclick="stergeContact(${i})">✕</button>
    </div>
  `).join('');
}

randeazaContacte();
</script>
</body>
</html>
